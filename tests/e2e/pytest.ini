[pytest]
# ─── Test Discovery ───────────────────────────────────────────────────────────
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── Test Ordering ────────────────────────────────────────────────────────────
# Tests are ordered sequentially by filename (test_01 → test_36).
# The conftest.py pytest_collection_modifyitems hook sorts by filename.
# Disable any random ordering plugins.
addopts =
    -p no:randomly
    --strict-markers
    --tb=short
    -v

# ─── Markers ─────────────────────────────────────────────────────────────────
markers =
    preflight: Docker Desktop and environment validation (R1)
    boot: Boot_Bundle startup and healthcheck (R2)
    wizard: Playwright-driven Setup Wizard tests (R3-R8)
    smoke: Real API smoke tests against external services (R9-R15)
    error: Error path and invalid input tests (R16-R19)
    bugfix: Pre-existing bug fix verification tests (R20-R25, R32)
    property: Hypothesis property-based fuzzing tests (R26-R28)
    resilience: Service crash, reconnect, and concurrency tests (R33-R36)
    evidence: Evidence collection and report generation (R29-R31)
    slow: Tests that take more than 60 seconds
    # Post-spec marker groups (added alongside R37-R39):
    wiring: Automation-service lifespan wiring contract (R37 — automation-service-wiring spec)
    llm_providers: LLM provider management backend + UI surface (R38, R39 — llm-provider-management spec)

# ─── Hypothesis Settings ──────────────────────────────────────────────────────
# Hypothesis database for reproducible counterexamples
# Stored relative to workspace: platform/.hypothesis/
[hypothesis]
database_path = ../../.hypothesis
max_examples = 200
deadline = 60000
suppress_health_check = too_slow

# ─── Timeouts ─────────────────────────────────────────────────────────────────
# pytest-timeout configuration (if installed)
timeout = 600
timeout_method = thread

# ─── Evidence Output ──────────────────────────────────────────────────────────
# Evidence directory is configured via the evidence_collector fixture.
# Default: {workspace_root}/e2e-evidence/
# JUnit XML output for CI integration
junit_family = xunit2

# ─── Logging ──────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
