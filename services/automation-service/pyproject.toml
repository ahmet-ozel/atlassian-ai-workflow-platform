[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "automation-service"
version = "0.0.0"
description = "Automation HTTP service skeleton (FastAPI on :8080) for the platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Platform" }]
dependencies = [
    "fastapi",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "temporalio",
    "httpx",
    "jsonschema",
    "asyncpg",
    "mcp",
    # Workspace path dependency on the shared HTTP / logging utilities.
    # ``http-shared`` ships the secret-redaction logging filter wired
    # in ``src/main.py``. ``hatchling``
    # accepts PEP 508 direct references when ``allow-direct-references``
    # is enabled below.
    "http-shared @ file:libs/http-shared",
    # :class:`observability.TraceMiddleware`
    # is mounted on the FastAPI app to extract / generate the
    # ``X-Trace-Id`` header for end-to-end correlation
    # marks the automation-service trace boundary.
    "observability @ file:libs/observability",
]

# Opt in to PEP 508 ``@ file:`` direct references so the
# ``http-shared`` workspace path dependency is accepted at
# metadata-build time.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# The wheel ships only the canonical ``automation_service`` package
# (shared Temporal capability helpers, imported as
# ``automation_service.*``). The legacy ``src.*`` entry points
# (``src.main``/``src.webhooks``/``src.decision``) are served at
# runtime from the source tree copied to ``/app/src`` (uvicorn runs
# from WORKDIR ``/app`` so ``src`` resolves on the CWD path) and by
# the test tree - NOT from the wheel. Listing ``src`` as a second
# package here makes hatchling map ``src/automation_service/__init__.py``
# to ``automation_service/__init__.py`` twice and abort with a
# duplicate-archive-path error.
packages = ["src/automation_service"]

[tool.hatch.build.targets.wheel.sources]
"src/automation_service" = "automation_service"
