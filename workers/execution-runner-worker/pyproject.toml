[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "execution-runner-worker"
version = "0.0.0"
description = "Temporal worker that hosts ExecutionRunWorkflow and SSH/Docker/Vault/MinIO activities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Platform" },
]
dependencies = [
    "temporalio>=1.7,<2",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "paramiko>=3.4,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "http-shared @ file:../../libs/http-shared",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
execution-runner-worker = "execution_runner.main:run"

[tool.hatch.build.targets.wheel]
# The wheel ships only the canonical ``execution_runner`` package so the
# console script (``execution_runner.main:run``) resolves after install.
# The legacy ``src.*`` namespace is served at runtime from the source
# tree copied to ``/app/src`` and by the test tree — NOT from the wheel.
# Listing ``src`` as a second package makes hatchling map
# ``src/execution_runner/__init__.py`` to ``execution_runner/__init__.py``
# twice and abort with a duplicate-archive-path error.
packages = ["src/execution_runner"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "pyproject.toml",
]
