[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-tracking"
version = "0.1.0"
description = "Idempotent cost insert and dept-vs-global cost predictor."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.29"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
