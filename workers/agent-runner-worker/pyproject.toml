[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-runner-worker"
version = "0.0.0"
description = "Temporal worker that hosts AgentRunnerWorkflow and Jira, Bitbucket, Confluence, LLM, artifact, and opencode activities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Platform" },
]
dependencies = [
    "temporalio>=1.7,<2",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "aiobotocore>=2.13,<3",
]

[project.scripts]
agent-runner-worker = "agent_runner.main:run"

[tool.hatch.build.targets.wheel]
# The wheel ships the canonical ``agent_runner.*`` namespace so the
# ``agent-runner-worker`` console script (``agent_runner.main:run``)
# resolves after ``pip install``. The legacy ``src.*`` namespace that
# older tests and the activity loader import is served at runtime from
# the source tree copied to ``/app/src`` (with ``PYTHONPATH=/app`` -
# see the Dockerfile), not from the wheel, so it must NOT be listed
# here as a second package: doing so makes hatchling map
# ``src/agent_runner/__init__.py`` to ``agent_runner/__init__.py``
# twice and abort with a duplicate-archive-path error.
packages = ["src/agent_runner"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "prompts",
    "README.md",
    "pyproject.toml",
]
