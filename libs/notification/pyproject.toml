[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "notification"
version = "0.0.0"
description = "Slack + email notification dispatcher (success-gated, failure-mandatory) shared across services and workers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Platform" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]
