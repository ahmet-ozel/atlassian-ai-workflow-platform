[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "http-shared"
version = "0.0.0"
description = "Shared HTTP client factory that injects X-Client-Source on all outgoing MCP/Firecrawl calls."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Multi-Service Scaffold" }]
dependencies = [
    "httpx>=0.27,<1",
    "starlette>=0.27",
    # ``observability`` ships :func:`get_trace_id` (platform-gap-fill
    # task 7.1) which the MCP-client factory consults via an httpx
    # request hook to stamp every outgoing call with ``X-Trace-Id``
    # (Requirement 8.4 / 8.5).  The lib is dependency-light (stdlib +
    # prometheus_client) so taking it on as a peer here does not add
    # weight to the runtime image.
    "observability @ file:../observability",
]

# Opt in to PEP 508 ``@ file:`` direct references so the
# ``observability`` workspace path dependency is accepted at
# metadata-build time.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/http_shared"]
