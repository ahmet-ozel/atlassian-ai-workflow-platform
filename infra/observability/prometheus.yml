global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: atlassian-mcp
    metrics_path: /metrics
    static_configs:
      - targets:
          - atlassian-mcp:8090

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: platform-http-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://admin-dashboard-api:8082/healthz
          - http://admin-dashboard-ui:3000/
          - http://assistant-service:8081/healthz
          - http://automation-service:8080/healthz
          - http://atlassian-mcp:8090/healthz
          - http://firecrawl:3002/healthz
          - http://grafana:3000/api/health
          - http://loki:3100/ready
          - http://minio:9000/minio/health/live
          - http://streamlit-ui:8501/_stcore/health
          - http://vault:8200/v1/sys/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "https?://([^:/]+).*"
        target_label: service
        replacement: "$1"
      - target_label: __address__
        replacement: blackbox-exporter:9115
