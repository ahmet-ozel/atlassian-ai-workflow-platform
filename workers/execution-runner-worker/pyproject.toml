[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "execution-runner-worker"
version = "0.0.0"
description = "Temporal worker that hosts ExecutionRunWorkflow and SSH/Docker/Vault/MinIO activities for the multi-service scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Multi-Service Scaffold" },
]
dependencies = [
    "temporalio>=1.7,<2",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "paramiko>=3.4,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "http-shared @ file:../../libs/http-shared",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
execution-runner-worker = "execution_runner.main:run"

[tool.hatch.build.targets.wheel]
# Both packages ship in the wheel during the platform-mimari-workflows
# spec migration: the legacy ``src.*`` namespace (older tests still
# import via ``from src.workflows...``) and the canonical
# ``execution_runner.*`` namespace introduced by task 2.5.
packages = ["src", "src/execution_runner"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "pyproject.toml",
]
