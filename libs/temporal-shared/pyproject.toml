[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "temporal-shared"
version = "0.0.0"
description = "Shared Temporal capability dictionary and helpers for platform services and workers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Platform" },
]
dependencies = [
    "temporalio>=1.7,<2",
    # ``temporal_shared.pdf_render`` renders Jinja2 HTML
    # templates to PDF bytes for the ``jira_attachment`` output
    # action.  WeasyPrint requires native runtime deps (Pango, Cairo,
    # GLib); the runtime image installs them, the unit test skips
    # cleanly when they are missing locally.
    "Jinja2>=3.1,<4",
    "weasyprint>=62,<66",
]

[project.urls]
Documentation = "file://./README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_shared"]

[tool.hatch.build.targets.sdist]
include = [
    "src/temporal_shared",
    "README.md",
    "pyproject.toml",
]
