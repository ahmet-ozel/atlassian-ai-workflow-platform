# =============================================================================
# Traefik Static Configuration
# =============================================================================
# Production Hardening — TLS Reverse Proxy (Requirement 3.1, 3.2, 3.3)
#
# This file defines the static configuration for Traefik. Dynamic routing
# rules (per-service labels or file-based) live in the `dynamic/` directory.
#
# Environment-aware behavior:
#   - Production (PLATFORM_ENV=production):
#       Uses Let's Encrypt ACME for automatic TLS certificate provisioning.
#   - Development (PLATFORM_ENV=development or unset):
#       Uses a self-signed default certificate for local TLS termination.
# =============================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ---------------------------------------------------------------------------
# API / Dashboard (disabled in production, useful for dev debugging)
# ---------------------------------------------------------------------------
api:
  dashboard: false
  insecure: false

# ---------------------------------------------------------------------------
# Ping (health check endpoint for container orchestration)
# ---------------------------------------------------------------------------
ping: {}

# ---------------------------------------------------------------------------
# Log configuration
# ---------------------------------------------------------------------------
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"

# ---------------------------------------------------------------------------
# Entrypoints
# ---------------------------------------------------------------------------
entryPoints:
  web:
    address: ":80"
    # HTTP→HTTPS redirect is configured via dynamic middleware (task 3.3)
    # but we declare the redirection at entrypoint level as well for
    # production environments.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# ---------------------------------------------------------------------------
# Certificate Resolvers
# ---------------------------------------------------------------------------
certificatesResolvers:
  # Production: Let's Encrypt ACME (Requirement 3.2)
  letsencrypt:
    acme:
      # Email for Let's Encrypt notifications (override via ACME_EMAIL env var)
      email: "${ACME_EMAIL:-admin@example.com}"
      # Certificate storage file (persisted via volume mount)
      storage: /etc/traefik/acme/acme.json
      # Use TLS-ALPN-01 challenge (no need to expose port 80 to ACME)
      tlsChallenge: {}

  # Development: self-signed certificate (Requirement 3.3)
  # In development, Traefik uses its built-in default certificate when no
  # resolver matches. The `default` TLS store below provides a self-signed
  # cert for local development without requiring Let's Encrypt.

# ---------------------------------------------------------------------------
# TLS Configuration
# ---------------------------------------------------------------------------
tls:
  # Default TLS store — used when no certResolver is specified or in
  # development mode. Traefik auto-generates a self-signed certificate
  # when defaultGeneratedCert is enabled.
  stores:
    default:
      defaultGeneratedCert:
        resolver: ""
        domain:
          main: "localhost"
          sans:
            - "*.localhost"

  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------
providers:
  # Docker provider — label-based routing (Requirement 3.4)
  docker:
    # Traefik watches Docker events for container labels
    endpoint: "unix:///var/run/docker.sock"
    # Only route containers with `traefik.enable=true` label
    exposedByDefault: false
    # Watch for container changes
    watch: true

  # File provider — dynamic routing rules from the dynamic/ directory
  file:
    directory: /etc/traefik/dynamic
    watch: true
