[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "auth-shared"
version = "0.0.0"
description = "Shared OIDC/JWT validation primitives for HTTP services and workers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Platform" }]
dependencies = [
    "python-jose[cryptography]>=3.3,<4",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auth_shared"]
