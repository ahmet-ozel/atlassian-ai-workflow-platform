# =============================================================================
# infra/docker-compose.prod.yml — production override
# =============================================================================
# Y1 fix (GEREKSINIM_ANALIZI.md): the base compose ships dev-only
# defaults (``POSTGRES_PASSWORD=ai_dev_only``,
# ``VAULT_DEV_ROOT_TOKEN_ID=dev-token-not-for-prod``,
# ``AUTH_PROVIDER=local``). This override file:
#
#   1. Requires production credentials to be supplied via the
#      environment — no dev defaults are inherited. ``docker compose``
#      will refuse to start a service whose required variable is unset.
#   2. Forces ``AUTH_PROVIDER=oidc`` (the canonical production auth
#      provider) on automation-service. The dev ``local`` bypass — which
#      accepts any non-empty bearer token — is disabled.
#   3. Switches Vault out of ``-dev`` mode and onto persistent storage.
#      A full unseal flow is documented in
#      ``docs/runbooks/vault-production.md`` (Y2 follow-up).
#   4. Tightens log retention and container restart policy.
#
# Usage:
#   make prod                    # equivalent to:
#   docker compose -p platform \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.prod.yml \
#     up -d
#
# The Makefile's ``prod`` target wires this file alongside the base.
# Never run ``make boot`` or ``make up-all`` in production — they layer
# the dev override which re-introduces the bind-mount source dirs and
# the dev secrets fallback.
# =============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────
  # Postgres — explicit required credentials, no dev fallback.
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    environment:
      # ``${POSTGRES_PASSWORD:?must be set in production}`` — Compose
      # syntax: bash-style "required" expansion. Absent variable aborts
      # the ``up`` with a clear error before any container starts.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in production}

  # ──────────────────────────────────────────────────────────────────────
  # Vault — production mode (no -dev, persistent storage). See
  # docs/runbooks/vault-production.md for the init+unseal flow.
  # ──────────────────────────────────────────────────────────────────────
  vault:
    # Override the dev-mode command. The base compose runs vault in
    # -dev which keeps secrets in memory (data lost on restart). The
    # production image runs ``vault server`` against a config file
    # mounted at /vault/config/config.hcl describing the raft (or
    # file) storage backend. The container starts SEALED — operators
    # must run ``vault operator init`` once, then unseal on every
    # restart (or use auto-unseal via cloud KMS).
    command:
      - sh
      - -lc
      - |
        chown -R vault:vault /vault/data
        exec su-exec vault vault server -config=/vault/config/config.hcl
    environment:
      # Drop the dev root token entirely — production token comes from
      # ``vault operator init``'s output and lives in operator-managed
      # secret storage, not env.
      VAULT_DEV_ROOT_TOKEN_ID: ""
      VAULT_DEV_LISTEN_ADDRESS: ""
      VAULT_ADDR: ${VAULT_ADDR:-http://0.0.0.0:8200}
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/data
    # Production healthcheck must tolerate the SEALED state until an
    # operator unseals. /v1/sys/health returns 503 when sealed but
    # initialised; the standby/uninitialised states return other
    # non-200 codes that should also keep the container "starting"
    # until unsealed.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:8200/v1/sys/seal-status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ──────────────────────────────────────────────────────────────────────
  # MinIO — required root password.
  # ──────────────────────────────────────────────────────────────────────
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in production}

  # ──────────────────────────────────────────────────────────────────────
  # automation-service — OIDC mandatory in production.
  # ──────────────────────────────────────────────────────────────────────
  automation-service:
    environment:
      # Force OIDC even if .env still carries AUTH_PROVIDER=local. The
      # dev ``local`` bypass accepts any non-empty bearer token — never
      # acceptable in production. The credential-guard (extended for
      # Y1) refuses boot if AUTH_PROVIDER=local slips through.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-oidc}
      VAULT_BACKEND: ${VAULT_BACKEND:-hashicorp}
      # PLATFORM_ENV=production activates the existing credential
      # guard in admin-dashboard-api/src/lifecycle/credential_guard.py
      # (see DEV_DEFAULTS). The guard blocks boot when any dev-default
      # sentinel value is detected.
      PLATFORM_ENV: production

  # ──────────────────────────────────────────────────────────────────────
  # admin-dashboard-api — production startup guard.
  # ──────────────────────────────────────────────────────────────────────
  admin-dashboard-api:
    environment:
      # Activates credential_guard (see services/admin-dashboard-api/
      # src/lifecycle/credential_guard.py): boot is blocked when a
      # dev-default sentinel is detected. PLATFORM_ENV=production was
      # already the existing trigger; Y1 only extends the DEV_DEFAULTS
      # list to cover AUTH_PROVIDER=local and VAULT_DEV_ROOT_TOKEN_ID.
      PLATFORM_ENV: production
    # Drop the docker socket bind mount in production — the admin
    # dashboard restarting containers from inside the network is a
    # dev-only convenience documented in the base compose.
    volumes:
      - ../config:/app/config:ro
      - ./postgres/migrations:/app/migrations:ro

volumes:
  vault_data:
