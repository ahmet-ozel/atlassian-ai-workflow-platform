; Workspace-root pytest configuration for the platform test suite.
;
; * ``testpaths`` keeps collection scoped to the workspace test suite
;   and prevents pytest from descending into ``atlassian_mcp_bitbucket/``
;   (which is treated as a vendored MCP gateway) or into the
;   per-Component ``services/*/tests`` trees that ship with their own
;   pyproject.
;
; * ``pythonpath`` injects the ``src/`` directory of every Python
;   shared library under ``libs/`` so tests can ``import http_shared``,
;   ``import llm_orchestrator``, etc. without first ``pip install``-ing
;   each lib. This mirrors the ``sys.path`` manipulation in
;   ``tests/conftest.py`` (kept for direct ``python -m pytest`` invocation
;   from a non-pytest entrypoint) and supersedes it when pytest is the
;   driver.
;
; * ``rootdir_fallback`` is implicit (the directory containing this
;   file). All other defaults are intentionally left untouched.

[pytest]
minversion = 8.0

testpaths =
    tests

pythonpath =
    libs/audit_logger/src
    libs/auth-shared/src
    libs/cost-tracking/src
    libs/db-shared/src
    libs/git-shared/src
    libs/http-shared/src
    libs/llm-orchestrator/src
    libs/mcp_client/src
    libs/messages/src
    libs/notification/src
    libs/observability/src
    libs/pii-shared/src
    libs/prompts/src
    libs/temporal-shared/src
    libs/vault_client/src

; ``--strict-markers`` makes typo'd markers a hard failure, which keeps
; the property-test suite from silently growing dead-letter markers.
; ``-ra`` surfaces the short summary for skipped / xfailed cases so the
; ``--run-docker`` gating in ``tests/integration/`` is always visible.
addopts =
    -ra
    --strict-markers

; Markers used across the suite. Add new entries here when introducing
; a new marker so ``--strict-markers`` keeps approving them.
markers =
    integration: tests that require external services (Docker, Compose, network).
    slow: tests whose runtime exceeds a few seconds; excluded from fast lanes.
